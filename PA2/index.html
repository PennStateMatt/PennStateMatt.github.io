<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Battle</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
     <div class="grid-container">
    <header class="section header">
      <h1>Pokemon Blue Battle</h1>
    </header>
    <aside class="section sidebar">
      <h3>PokeDex</h3>
      <div class="pokedex">
        <div class="party">
          <p>Squirtle (Lvl. 10)</p>
        </div>
        <div class="party">
          <p>Pidgey (Lvl. 8)</p>
        </div>
      </div>
    </aside>
    <main class="section arena">
      <div class="arena">
        <div class="opponent">
          <div class="status-box">
            <div class="status-name">Pidgey</div>
            <div class="status-hp"><div class="hp-fill" style="width: 50%;"></div></div>
          </div>
          <img class="pokemon pidgey" src="pidgey.png" alt="Pidgey">
        </div>
        <div class="player">
          <img class="pokemon squirtle" src="squirtle.png" alt="Squirtle">
          <div class="status-box">
            <div class="status-name">Squirtle</div>
            <div class="status-hp"><div class="hp-fill" style="width: 100%;"></div></div>
          </div>
        </div>
      </div>
    </main>
    <section class="section commands">
      <h3>Moves</h3>
      <div class="command-menu">
        <button class="button-press">BATTLE</button>
        <button class="button">BAG</button>
        <button class="button">POKEMON</button>
        <button class="button">RUN</button>
      </div>
    </section>
    <section class="section moves">
      <h3>Attacks</h3>
      <div class="moves-grid">
        <button class="button-attack ">Tackle</button>
        <button class="button">Water Gun</button>
        <button class="button">Tail Whip</button>
        <button class="button">Withdraw</button>
      </div>
    </section>
    <footer class="section footer">
      <p>You're prepared for BATTLE.  Squirtle Tackle!</p>
    </footer>
  </div>
</body>
</html>
